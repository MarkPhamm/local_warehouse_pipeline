name: dbt schema review

on:
  pull_request:

permissions:
  contents: read

jobs:
  schema-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install dbt dependencies
        run: uv pip install --system "dbt-core==1.12.6" "dbt-duckdb==1.11.0"
      - name: Prepare local inputs
        run: mkdir -p database
      - name: Compare compiled model schemas
        uses: PresentJay/dbt-plan@d98f06e8674a1e68a009112b90d0d00c41416c33 # v0.18.5
        with:
          project-dir: duckdb_dbt
          compile-command: dbt compile --profiles-dir . --no-partial-parse
          version: '0.18.5'
          fail-on: never
